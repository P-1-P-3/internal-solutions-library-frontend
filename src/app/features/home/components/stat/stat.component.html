<div
    class="stats stats-vertical lg:stats-horizontal shadow-sm w-full rounded-md border"
    [class.bg-white]="!dark()"
    [class.bg-slate-950]="dark()"
    [class.border-slate-200]="!dark()"
    [class.border-slate-700]="dark()">
    <div class="stat">
        <div class="stat-figure" [class.text-secondary]="!dark()" [class.text-slate-300]="dark()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="inline-block h-8 w-8">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="currentColor" d="M22 13.5c0 1.76-1.3 3.22-3 3.46V20a2 2 0 0 1-2 2h-3.8v-.3a2.7 2.7 0 0 0-2.7-2.7c-1.5 0-2.7 1.21-2.7 2.7v.3H4a2 2 0 0 1-2-2v-3.8h.3C3.79 16.2 5 15 5 13.5s-1.21-2.7-2.7-2.7H2V7a2 2 0 0 1 2-2h3.04c.24-1.7 1.7-3 3.46-3s3.22 1.3 3.46 3H17a2 2 0 0 1 2 2v3.04c1.7.24 3 1.7 3 3.46M17 15h1.5a1.5 1.5 0 0 0 1.5-1.5a1.5 1.5 0 0 0-1.5-1.5H17V7h-5V5.5A1.5 1.5 0 0 0 10.5 4A1.5 1.5 0 0 0 9 5.5V7H4v2.12c1.76.68 3 2.38 3 4.38s-1.25 3.7-3 4.38V20h2.12a4.7 4.7 0 0 1 4.38-3c2 0 3.7 1.25 4.38 3H17z" />
            </svg>
        </div>
        <div class="stat-title" [class.text-slate-300]="dark()">Soluciones</div>
        <div class="stat-value" [class.text-white]="dark()">{{ solutionsLength() }}</div>
    </div>

    <div class="stat">
        <div class="stat-figure" [class.text-secondary]="!dark()" [class.text-slate-300]="dark()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="inline-block h-8 w-8">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="currentColor" d="M11 13.5v8H3v-8zm-2 2H5v4h4zM12 2l5.5 9h-11zm0 3.86L10.08 9h3.84zM17.5 13c2.5 0 4.5 2 4.5 4.5S20 22 17.5 22S13 20 13 17.5s2-4.5 4.5-4.5m0 2a2.5 2.5 0 0 0-2.5 2.5a2.5 2.5 0 0 0 2.5 2.5a2.5 2.5 0 0 0 2.5-2.5a2.5 2.5 0 0 0-2.5-2.5" />
            </svg>
        </div>
        <div class="stat-title" [class.text-slate-300]="dark()">Categorías</div>
        <div class="stat-value" [class.text-white]="dark()">{{ categoriesLength() }}</div>
    </div>

    <div class="stat">
        <div class="stat-figure" [class.text-secondary]="!dark()" [class.text-slate-300]="dark()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="inline-block h-8 w-8">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="currentColor" d="m12.89 3l1.96.4L11.11 21l-1.96-.4zm6.7 9L16 8.41V5.58L22.42 12L16 18.41v-2.83zM1.58 12L8 5.58v2.83L4.41 12L8 15.58v2.83z" />
            </svg>
        </div>
        <div class="stat-title" [class.text-slate-300]="dark()">Tecnologías</div>
        <div class="stat-value" [class.text-white]="dark()">{{ technologiesLength() }}</div>
    </div>
</div>
