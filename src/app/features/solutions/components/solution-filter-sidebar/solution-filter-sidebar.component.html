<div class="drawer lg:drawer-open">
    <input id="my-drawer-3" type="checkbox" class="drawer-toggle" />

    <div class="drawer-content flex flex-col items-start pb-2 lg:hidden">
        <label for="my-drawer-3" class="btn btn-outline drawer-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227" />
            </svg>
            Filtrar
        </label>
    </div>

    <div class="drawer-side z-40 lg:h-[calc(100dvh-2rem)]">
        <label for="my-drawer-3" aria-label="Cerrar filtros" class="drawer-overlay"></label>

        <aside class="box-border h-dvh min-h-0 w-72 overflow-y-auto shadow-xl lg:h-[calc(100dvh-2rem)] lg:rounded-box lg:border border-slate-200 p-5 lg:shadow-sm">
            <div>
                <div class="flex flex-row items-center gap-2">
                    <h2 class="text-2xl font-semibold text-base-content">Filtros</h2>
                </div>
                <p class="mt-1 text-sm text-base-content/60">Encuentra la solución que necesitas</p>
                <div class="divider"></div>
            </div>

            <div class="flex flex-col gap-4">
                <label class="form-control w-full">
                    <span class="label-text font-medium">Título</span>
                    <input
                        type="text"
                        placeholder="Buscar por título"
                        class="input input-bordered w-full mt-2"
                        (input)="onTitleInput(searchTitle.value)"
                        #searchTitle
                    />
                </label>

                <fieldset class="form-control">
                    <legend class="label-text mb-1 font-medium">Categoría</legend>
                    <div class="space-y-1">
                        @for (category of categories(); track category.id) {
                            <label class="label cursor-pointer justify-start gap-3 rounded-lg px-2 py-2 hover:bg-base-200">
                                <input
                                    type="checkbox"
                                    [checked]="filters.categories.includes(category.id)"
                                    (change)="onCheckboxChange('categories', category.id, $event)"
                                    class="checkbox checkbox-primary checkbox-sm"
                                />
                                <span class="label-text">{{ category.type }}</span>
                            </label>
                        }
                    </div>
                </fieldset>

                <fieldset class="form-control">
                    <legend class="label-text mb-1 font-medium">Área funcional</legend>
                    <div class="space-y-1">
                        @for (fncArea of fncAreas(); track fncArea.id) {
                            <label class="label cursor-pointer justify-start gap-3 rounded-lg px-2 py-2 hover:bg-base-200">
                                <input
                                    type="checkbox"
                                    [checked]="filters.funcAreas.includes(fncArea.id)"
                                    (change)="onCheckboxChange('funcAreas', fncArea.id, $event)"
                                    class="checkbox checkbox-primary checkbox-sm"
                                />
                                <span class="label-text">{{ fncArea.functional_area }}</span>
                            </label>
                        }
                    </div>
                </fieldset>

                <fieldset class="form-control">
                    <legend class="label-text mb-1 font-medium">Tecnología</legend>
                    <div class="flex flex-col">
                        @for (technology of technologies(); track technology.id) {
                            <label class="label cursor-pointer justify-start gap-3 rounded-lg px-2 py-1.5 hover:bg-base-200">
                                <input
                                    type="checkbox"
                                    [checked]="filters.technologies.includes(technology.id)"
                                    (change)="onCheckboxChange('technologies', technology.id, $event)"
                                    class="checkbox checkbox-primary checkbox-xs"
                                />
                                <span class="">{{ technology.technology }}</span>
                            </label>
                        }
                    </div>
                </fieldset>

                <div>
                    <app-tags-field 
                        [options]="tags()"
                        [selectedIds]="filters.tags"
                        (selectedIdsChange)="onSelectedIdsTagsChange($event)" />
                </div>
            </div>
        </aside>
    </div>
</div>
