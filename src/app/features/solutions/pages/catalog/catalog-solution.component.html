<div class="grid min-w-0 grid-cols-1 gap-4 p-4 lg:grid-cols-[18rem_minmax(0,1fr)]">
    <div
        class="min-w-0 lg:sticky lg:self-start"
        [style.top.px]="filterTop()"
        [style.height.px]="filterHeight()"
    >
        <app-solution-filter-sidebar class="block h-full"
            [initFilterValue]="initFilterValue()"
            [categories]="categories()"
            [technologies]="technologies()"
            [fncAreas]="funcAreas()"
            [tags]="tags()"
            (filtersChange)="onFilterChange($event)"
        />
    </div>

    <div class="min-w-0 w-full">
        <div class="mb-4">
            <p class="text-sm font-medium text-base-content/60">{{ solutions().length }} resultados</p>
        </div>

        <app-solution-result-grid [solutions]="solutions()" />
    </div>
</div>
