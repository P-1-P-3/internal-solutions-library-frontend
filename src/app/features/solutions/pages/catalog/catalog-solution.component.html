<div class="grid min-w-0 grid-cols-1 gap-4 p-4 lg:grid-cols-[18rem_minmax(0,1fr)]">
    <div
        class="min-w-0 lg:sticky lg:self-start"
        [style.top.px]="filterTop()"
        [style.height.px]="filterHeight()"
    >
        <app-solution-filter-sidebar class="block h-full"
            [initFilterValue]="initFilterValue()"
            [categories]="categories()"
            [technologies]="technologies()"
            [fncAreas]="funcAreas()"
            [tags]="tags()"
            (filtersChange)="onFilterChange($event)"
        />
    </div>

    <div class="flex flex-col gap-6 min-w-0 w-full">
        <div>
            <p class="text-sm font-medium text-base-content/60">{{ totalItems() }} resultados</p>
        </div>

        @if (loadError()) {
            <p class="alert alert-error alert-soft" role="alert">{{ loadError() }}</p>
        }

        @defer (on viewport) {
            <app-solution-result-grid [solutions]="solutions()" />
        } @placeholder {
            <p>Cargando...</p>
        }

        <div>
            <app-pagination
                labelSize="Soluciones por página"
                [totalRecords]="totalItems()"
                [pageSize]="pageSize()"
                [currentPage]="currentPage()"
                (currentPageChange)="currentPage.set($event)"
                (pageSizeChange)="pageSize.set($event)"
            />
        </div>
    </div>
</div>
