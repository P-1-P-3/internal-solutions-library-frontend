<main class="mx-auto max-w-7xl lg:p-4">
    <header class=" border-slate-200">
        <div class="mx-auto max-w-7xl px-5 py-5 sm:px-8">
            <div class="mt-5 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
                <div>
                    <p class="text-xs font-bold tracking-widest text-primary uppercase"></p>
                        <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">Administración</h1>
                        <p class="mt-3 max-w-2xl text-slate-600">Gestiona accesos y catálogos compartidos de la plataforma.</p>
                </div>
            </div>
        </div>
    </header>

    <div class="mx-auto grid max-w-7xl gap-6 px-5 py-8 sm:px-8 lg:grid-cols-[15rem_minmax(0,1fr)] lg:items-start">
        <aside class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm lg:sticky lg:top-24">
            <nav aria-label="Secciones de administración" class="flex gap-1 p-2 lg:flex-col">
                @for (section of adminSection; track section.key) {
                    @if (section.route) {
                        <a
                            [routerLink]="section.route"
                            routerLinkActive="bg-slate-950 text-white"
                            ariaCurrentWhenActive="page"
                            #activeLink="routerLinkActive"
                            class="flex min-w-48 flex-col rounded-xl px-4 py-3 transition hover:opacity-80 lg:min-w-0">
                            <span class="font-semibold">{{ section.label }}</span>
                            <span
                                class="text-sm"
                                [class.text-slate-500]="!activeLink.isActive"
                                [class.text-white]="activeLink.isActive">
                                {{ section.description }}
                            </span>
                        </a>
                    } @else {
                        <div
                            aria-disabled="true"
                            class="flex min-w-48 cursor-not-allowed flex-col rounded-xl px-4 py-3 text-slate-400 lg:min-w-0">
                            <span class="font-semibold">{{ section.label }}</span>
                            <span class="text-sm">{{ section.description }}</span>
                            <span class="mt-1 text-xs">Próximamente</span>
                        </div>
                    }
                }
            </nav>
        </aside>

        <div class="min-w-0">
            <router-outlet />
        </div>
    </div>
</main>
