<section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm pb-5">
    <div class="flex flex-col justify-between gap-4 border-b border-slate-200 p-6 sm:flex-row sm:items-center">
          <div>
            <h2 class="text-xl font-bold text-slate-950">Usuarios</h2>
            <p class="mt-1 text-sm text-slate-500">{{ users().length }} cuentas registradas</p>
          </div>
          <a routerLink="/admin/users/new" class="btn btn-neutral min-h-11 text-sm font-semibold">+ Crear usuario</a>
    </div>

    <div class="border-b border-slate-100 p-4 sm:p-6">
        <label class="input">
            <span class="sr-only">Buscar por nombre, email o rol...</span>
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </g>
            </svg>
            <input 
                type="text" 
                placeholder="Buscar por nombre, email o rol..." 
                [value]="searchQuery()"
                (input)="onSearchInput(searchInput.value)"
                #searchInput />
        </label>
    </div>

    @if (msgSuccess()) {
        <div #successMessage role="alert" class="alert alert-success alert-soft m-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ msgSuccess() }}</span>
        </div>
    }

    @if (msgError()) {
        <div role="alert" class="alert alert-error alert-soft m-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ msgError() }}</span>
        </div>
    }

    <div>
        <app-table
            [columns]="columns()"
            [data]="filteredUsers()"
            (executeAction)="handleTableAction($event)"
        />
    </div>
</section>
